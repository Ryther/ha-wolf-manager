[workspace]
members = ["crates/wolf-core", "crates/wolf-manager", "crates/wolf-host"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Ryther/ha-wolf-manager"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
tokio = { version = "1.53.2", features = ["full"] }
axum = "0.8.9"
russh = { version = "0.64.1", default-features = false, features = ["ring"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
argon2 = "0.6.0"
rand = "0.10.3"
toml = "1.1.7"
fs2 = "0.4.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tempfile = "3.27.0"
url = "2.5.8"
tower = { version = "0.5.3", features = ["util"] }
tower-http = "0.7.1"
webpki-roots = "1.0.9"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
