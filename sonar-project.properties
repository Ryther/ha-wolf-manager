# Server URL and credentials belong in SONAR_HOST_URL and SONAR_TOKEN.
sonar.projectKey=Ryther_ha-wolf-manager
sonar.organization=Ryther
sonar.projectName=HA Wolf Manager
sonar.sourceEncoding=UTF-8
sonar.sources=crates,web,scripts,installer
sonar.exclusions=**/tests/**,web/tests/**,scripts/ci/addon.schema.json
sonar.rust.lcov.reportPaths=_tmp/rust-evidence/rust.lcov
sonar.javascript.lcov.reportPaths=_tmp/ui-evidence/javascript.lcov
sonar.python.coverage.reportPaths=_tmp/rust-evidence/python.xml
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=_tmp/rust-evidence/clippy.json
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
