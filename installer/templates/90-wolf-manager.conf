# Managed by HA Wolf Manager. Public keys remain readable to the target UID.
Match User wolf-manager
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    DisableForwarding yes
    PermitUserRC no
    PermitUserEnvironment no
    AuthorizedKeysFile /etc/ssh/authorized_keys.d/wolf-manager
    ForceCommand /usr/libexec/wolf-manager/ssh-dispatcher
Match all
