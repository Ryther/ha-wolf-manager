name: Publish verified candidate
'on':
  workflow_run:
    workflows:
    - Release candidate
    types:
    - completed
    branches:
    - main
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful allowlisted Release candidate run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-publisher
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Ryther/ha-wolf-manager' && github.ref == 'refs/heads/main' && vars.RELEASE_PUBLISH_ENABLED ==
      'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      eligible: ${{ steps.verify.outputs.eligible }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
    - run: |-
        python -m scripts.ci.publish --run-id "$PRODUCER_RUN_ID" --workflow-id "$CANDIDATE_WORKFLOW_ID" --output _tmp/verified
      env:
        PRODUCER_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        CANDIDATE_WORKFLOW_ID: ${{ vars.CANDIDATE_WORKFLOW_ID }}
        GITHUB_TOKEN: ${{ github.token }}
      id: verify
  publish:
    needs:
    - verify
    if: needs.verify.outputs.eligible == 'true'
    environment: release
    permissions:
      contents: write
      packages: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
    - run: |-
        python -m scripts.ci.publish --run-id "$PRODUCER_RUN_ID" --workflow-id "$CANDIDATE_WORKFLOW_ID" --output _tmp/verified --publish
      env:
        PRODUCER_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        CANDIDATE_WORKFLOW_ID: ${{ vars.CANDIDATE_WORKFLOW_ID }}
        GITHUB_TOKEN: ${{ github.token }}
        RELEASE_PUBLISH_ENABLED: ${{ vars.RELEASE_PUBLISH_ENABLED }}
