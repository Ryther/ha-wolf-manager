name: CodeQL
'on':
  workflow_call:
    inputs:
      ref:
        description: Exact source commit
        required: true
        type: string
      subject_artifact:
        description: Exact caller frozen subject artifact
        required: true
        type: string
    outputs:
      artifact:
        description: CodeQL SARIF and gate report
        value: ${{ jobs.codeql.outputs.artifact }}
  schedule:
  - cron: 21 4 * * 1
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
env:
  CANDIDATE_SHA: ${{ inputs.ref || github.sha }}
jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ inputs.ref || github.sha }}
    - name: Verify exact checkout identity
      run: |-
        python - <<'PYREF'
        import os, re, subprocess
        expected = os.environ['CANDIDATE_SHA']
        assert re.fullmatch(r'[0-9a-f]{40}', expected), 'An exact commit SHA is required'
        assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected, 'Checkout differs from requested SHA'
        PYREF
    - run: mkdir -p _tmp/evidence
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' || inputs.subject_artifact
        != ''
      with:
        name: ${{ inputs.subject_artifact }}
        path: _tmp/subject
    - run: |-
        mkdir -p _tmp/evidence
        python -m scripts.ci.check_subject --bundle _tmp/subject --sha "$CANDIDATE_SHA" > _tmp/evidence/subject-binding.json
      if: inputs.subject_artifact != ''
    - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
      with:
        languages: rust,javascript-typescript,python,actions
        build-mode: none
        config-file: .github/codeql/config.yaml
    - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
      with:
        upload: false
        output: _tmp/evidence/codeql
    - run: python -m scripts.ci.security_gate _tmp/evidence/codeql
    - run: python -m scripts.ci.producer report --name codeql --sha "$CANDIDATE_SHA" --scope "Frozen candidate bytes
        and source SHA; codeql" --output _tmp/evidence/codeql.json
      if: inputs.subject_artifact != ''
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: evidence-codeql-${{ inputs.ref || github.sha }}
        path: _tmp/evidence
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        include-hidden-files: true
    permissions:
      contents: read
      actions: read
    outputs:
      artifact: evidence-codeql-${{ inputs.ref || github.sha }}
  upload:
    name: CodeQL Code Scanning
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository
      == 'Ryther/ha-wolf-manager'
    needs:
    - codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      if: inputs.subject_artifact != '' && always()
      with:
        name: evidence-image-scan-amd64-${{ inputs.ref || github.sha }}
        path: _tmp/image-amd64
    - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
      if: inputs.subject_artifact != '' && always() && hashFiles('_tmp/image-amd64/trivy-amd64.sarif') != ''
      with:
        sarif_file: _tmp/image-amd64/trivy-amd64.sarif
        category: candidate-image-amd64
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      if: inputs.subject_artifact != '' && always()
      with:
        name: evidence-image-scan-arm64-${{ inputs.ref || github.sha }}
        path: _tmp/image-arm64
    - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
      if: inputs.subject_artifact != '' && always() && hashFiles('_tmp/image-arm64/trivy-arm64.sarif') != ''
      with:
        sarif_file: _tmp/image-arm64/trivy-arm64.sarif
        category: candidate-image-arm64
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: evidence-codeql-${{ inputs.ref || github.sha }}
        path: _tmp/codeql-report
      if: always()
    - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
      with:
        sarif_file: _tmp/codeql-report/codeql
        category: candidate-security
      if: always() && hashFiles('_tmp/codeql-report/codeql/*.sarif') != ''
