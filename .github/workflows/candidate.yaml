        python -m scripts.ci.check_subject --bundle _tmp/subject --sha "$CANDIDATE_SHA" > _tmp/evidence/subject-binding.json
    - run: |-
        docker run --rm --mount "type=bind,source=$PWD/_tmp/subject/oci,target=/candidate,readonly" --mount "type=bind,source=$PWD/_tmp/evidence,target=/reports" ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --input /candidate --platform linux/amd64 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output /reports/trivy-amd64.json
    - run: |-
        python -m scripts.ci.producer report --name image-scan-amd64 --sha "$CANDIDATE_SHA" --scope "Frozen candidate bytes and source SHA; image-scan-amd64" --output _tmp/evidence/image-scan-amd64.json
