  sonar:
    name: sonar
    needs:
    - assemble
    - rust
    - ui
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - run: |-
        python -m scripts.ci.artifacts --run-id "$GITHUB_RUN_ID" --name "candidate-subject-${{ github.sha }}" --output _tmp/subject --extract
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - run: |-
        mkdir -p _tmp/evidence
        python -m scripts.ci.check_subject --bundle _tmp/subject --sha "$CANDIDATE_SHA" > _tmp/evidence/subject-binding.json
    - run: |-
        rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt,llvm-tools-preview
        rustup default 1.99.0
    - run: |-
        python -m scripts.ci.artifacts --run-id "$GITHUB_RUN_ID" --name "evidence-rust-${{ github.sha }}" --output _tmp/rust-evidence --extract
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - run: |-
        python -m scripts.ci.artifacts --run-id "$GITHUB_RUN_ID" --name "evidence-ui-${{ github.sha }}" --output _tmp/ui-evidence --extract
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - run: |-
        test -n "$SONAR_ORGANIZATION"
        test -n "$SONAR_PROJECT_KEY"
        test -s _tmp/rust-evidence/rust.lcov
        test -s _tmp/rust-evidence/clippy.json
        test -s _tmp/rust-evidence/python.xml
        test -s _tmp/ui-evidence/javascript.lcov
      env:
        SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        scannerVersion: 8.1.0.6389
        args: |-
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.projectVersion=${{ github.sha }}
          -Dsonar.scm.revision=${{ github.sha }}
          -Dsonar.sources=crates,web,scripts,installer
          -Dsonar.exclusions=**/tests/**,web/tests/**,scripts/ci/addon.schema.json
          -Dsonar.rust.lcov.reportPaths=_tmp/rust-evidence/rust.lcov
          -Dsonar.javascript.lcov.reportPaths=_tmp/ui-evidence/javascript.lcov
          -Dsonar.python.coverage.reportPaths=_tmp/rust-evidence/python.xml
          -Dsonar.rust.clippy.enabled=false
          -Dsonar.rust.clippyReport.reportPaths=_tmp/rust-evidence/clippy.json
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=600
    - run: |-
        python -m scripts.ci.sonar_gate --task .scannerwork/report-task.txt --sha "$CANDIDATE_SHA" --project "$SONAR_PROJECT_KEY" --rust-lcov _tmp/rust-evidence/rust.lcov --javascript-lcov _tmp/ui-evidence/javascript.lcov --python-xml _tmp/rust-evidence/python.xml --output _tmp/evidence/sonar-analysis.json
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    - run: |-
        python -m scripts.ci.producer report --name sonar --sha "$CANDIDATE_SHA" --scope "Frozen candidate bytes and source SHA; sonar" --output _tmp/evidence/sonar.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: evidence-sonar-${{ github.sha }}
        path: _tmp/evidence
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        include-hidden-files: true
    if: github.repository == 'Ryther/ha-wolf-manager' && github.ref == 'refs/heads/main'
