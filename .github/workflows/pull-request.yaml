name: Read-only pull requests
'on':
  pull_request: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  CANDIDATE_SHA: ${{ github.sha }}
jobs:
  static-amd64:
    name: static-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      with:
        version: v0.38.0
        driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
    - run: |-
        sh scripts/ci/native-build.sh amd64
    - run: |-
        mkdir -p _tmp/evidence
        find _tmp/platform -type f -print0 | sort -z | xargs -0 sha256sum > _tmp/evidence/static-amd64-files.sha256
    - run: |-
        python -m scripts.ci.producer report --name static-amd64 --sha "$CANDIDATE_SHA" --scope "Frozen candidate bytes and source SHA; static-amd64" --output _tmp/evidence/static-amd64.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: platform-amd64-${{ github.sha }}
        path: _tmp/platform
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        include-hidden-files: true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: evidence-static-amd64-${{ github.sha }}
        path: _tmp/evidence
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        include-hidden-files: true
  static-arm64:
    name: static-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      with:
        version: v0.38.0
        driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
    - run: |-
        sh scripts/ci/native-build.sh arm64
    - run: |-
        mkdir -p _tmp/evidence
        find _tmp/platform -type f -print0 | sort -z | xargs -0 sha256sum > _tmp/evidence/static-arm64-files.sha256
    - run: |-
        python -m scripts.ci.producer report --name static-arm64 --sha "$CANDIDATE_SHA" --scope "Frozen candidate bytes and source SHA; static-arm64" --output _tmp/evidence/static-arm64.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: platform-arm64-${{ github.sha }}
        path: _tmp/platform
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        include-hidden-files: true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: evidence-static-arm64-${{ github.sha }}
        path: _tmp/evidence
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        include-hidden-files: true
  assemble:
    needs:
    - static-amd64
    - static-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - run: |-
        python -m scripts.ci.artifacts --run-id "$GITHUB_RUN_ID" --name "platform-amd64-${{ github.sha }}" --output _tmp/amd64 --extract
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - run: |-
        python -m scripts.ci.artifacts --run-id "$GITHUB_RUN_ID" --name "platform-arm64-${{ github.sha }}" --output _tmp/arm64 --extract
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - run: |-
        python -m scripts.ci.producer assemble --amd64 _tmp/amd64 --arm64 _tmp/arm64 --output _tmp/subject
        python -m scripts.ci.check_subject --bundle _tmp/subject --sha "$CANDIDATE_SHA" --seal
        python -m scripts.ci.check_subject --bundle _tmp/subject --sha "$CANDIDATE_SHA"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: candidate-subject-${{ github.sha }}
        path: _tmp/subject
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        include-hidden-files: true
