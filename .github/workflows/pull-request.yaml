        python -m scripts.ci.check_subject --bundle _tmp/subject --sha "$CANDIDATE_SHA" > _tmp/evidence/subject-binding.json
    - run: |-
        rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt,llvm-tools-preview
        rustup default 1.99.0
    - run: |-
        sh scripts/ci/check.sh rust
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
