        path: _tmp/arm64
    - run: |-
        python -m scripts.ci.producer assemble --amd64 _tmp/amd64 --arm64 _tmp/arm64 --output _tmp/subject
        python -m scripts.ci.check_subject --bundle _tmp/subject --sha "$CANDIDATE_SHA" --seal
        python -m scripts.ci.check_subject --bundle _tmp/subject --sha "$CANDIDATE_SHA"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: candidate-subject-${{ inputs.ref }}
        path: _tmp/subject
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        include-hidden-files: true
    name: assemble
    outputs:
      artifact: candidate-subject-${{ inputs.ref }}
