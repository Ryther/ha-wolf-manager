    - run: python -m scripts.ci.producer report --name static-arm64 --sha "$CANDIDATE_SHA" --scope "Frozen candidate
        bytes and source SHA; static-arm64" --output _tmp/evidence/static-arm64.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: platform-arm64-${{ inputs.ref }}
        path: _tmp/platform
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        include-hidden-files: true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: evidence-static-arm64-${{ inputs.ref }}
        path: _tmp/evidence
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        include-hidden-files: true
  assemble:
    needs:
    - static-amd64
    - static-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ github.sha }}
    - name: Verify exact checkout identity
      run: |-
        python - <<'PYREF'
        import os, re, subprocess
        expected = os.environ['CANDIDATE_SHA']
        assert expected == os.environ['GITHUB_SHA'], 'Requested SHA differs from event subject'
        assert re.fullmatch(r'[0-9a-f]{40}', expected), 'An exact commit SHA is required'
        assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected, 'Checkout differs from requested SHA'
        PYREF
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: platform-amd64-${{ inputs.ref }}
        path: _tmp/amd64
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
