name: Reusable candidate tests
'on':
  workflow_call:
    inputs:
      ref:
        description: Exact current event SHA to validate
        required: true
        type: string
    outputs:
      subject_artifact:
        description: Frozen validated native image and host subject
        value: ${{ jobs.assemble.outputs.artifact }}
      rust_artifact:
        description: Rust/Python coverage and Clippy reports
        value: ${{ jobs.rust.outputs.artifact }}
      ui_artifact:
        description: Actual browser coverage and UI report
        value: ${{ jobs.ui.outputs.artifact }}
permissions:
  contents: read
  actions: read
env:
  CANDIDATE_SHA: ${{ inputs.ref }}
jobs:
  static-amd64:
    name: static-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ github.sha }}
    - name: Verify exact checkout identity
      run: |-
        python - <<'PYREF'
        import os, re, subprocess
        expected = os.environ['CANDIDATE_SHA']
        assert expected == os.environ['GITHUB_SHA'], 'Requested SHA differs from event subject'
        assert re.fullmatch(r'[0-9a-f]{40}', expected), 'An exact commit SHA is required'
        assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected, 'Checkout differs from requested SHA'
        PYREF
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      with:
        version: v0.38.0
        driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
    - run: sh scripts/ci/native-build.sh amd64
    - run: |-
        mkdir -p _tmp/evidence
        find _tmp/platform -type f -print0 | sort -z | xargs -0 sha256sum > _tmp/evidence/static-amd64-files.sha256
    - run: python -m scripts.ci.producer report --name static-amd64 --sha "$CANDIDATE_SHA" --scope "Frozen candidate
        bytes and source SHA; static-amd64" --output _tmp/evidence/static-amd64.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: platform-amd64-${{ inputs.ref }}
        path: _tmp/platform
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        include-hidden-files: true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: evidence-static-amd64-${{ inputs.ref }}
        path: _tmp/evidence
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        include-hidden-files: true
  static-arm64:
    name: static-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ github.sha }}
    - name: Verify exact checkout identity
      run: |-
